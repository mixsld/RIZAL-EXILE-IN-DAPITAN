<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>DOM RUNNING</title></head>
<body>
<pre id="out"></pre>
<script>
/* Tiny DOM test harness. Loads ../index.html in sized iframes.
   Run: bash tools/run_dom_tests.sh [namePrefix] */
const T = [];
function test(name, fn) { T.push({ name, fn }); }
function assert(c, m) { if (!c) throw new Error(m || 'assertion failed'); }
function eq(a, b, m) { if (a !== b) throw new Error((m || 'eq') + ': got ' + JSON.stringify(a) + ' want ' + JSON.stringify(b)); }
const wait = ms => new Promise(r => setTimeout(r, ms));
function load(w = 1920, h = 1080, query = '') {
  return new Promise((resolve, reject) => {
    const f = document.createElement('iframe');
    f.style.cssText = `width:${w}px;height:${h}px;border:0;display:block`;
    f.src = '../index.html' + (query ? '?' + query : '');
    const t0 = Date.now();
    f.onload = () => {
      const win = f.contentWindow;
      const ready = () => (win.Report && win.Report.app) ? resolve(win)
        : (Date.now() - t0 > 8000 ? reject(new Error('app did not boot')) : setTimeout(ready, 25));
      ready();
    };
    document.body.appendChild(f);
  });
}
function key(win, k) { win.document.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, bubbles: true })); }
async function press(win, k, n = 1) {
  for (let i = 0; i < n; i++) {
    if (win.Report.app.engine.isBusy()) { win.Report.app.engine.finishAnimations(); await wait(10); }
    key(win, k); await wait(60);
  }
}
/* press(): finishes any running animation first (like a presenter's first click), then sends one key. */
async function goStep(win, sceneId, stepId) { win.Report.app.engine.goToId(sceneId, stepId); await wait(60); }
const $ = (win, sel) => win.document.querySelector(sel);
const $$ = (win, sel) => [...win.document.querySelectorAll(sel)];
</script>
<script src="dom.tests.js"></script>
<script src="debug.tests.js"></script>
<script>
(async () => {
  const only = new URLSearchParams(location.search).get('only');
  const out = []; let fail = 0, ran = 0;
  for (const t of T) {
    if (only && !t.name.startsWith(only)) continue;
    ran++;
    try { await t.fn(); out.push('ok   ' + t.name); }
    catch (e) { fail++; out.push('FAIL ' + t.name + ' :: ' + e.message); }
    document.querySelectorAll('iframe').forEach(f => f.remove());
  }
  out.push(`${ran - fail}/${ran} passed`);
  document.getElementById('out').textContent = out.join('\u0001');
  document.title = fail ? 'DOM FAIL ' + fail : 'DOM PASS';
})();
</script>
</body></html>
