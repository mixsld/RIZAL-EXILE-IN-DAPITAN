<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="talisay_farm-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE0EA"/><stop offset="1" stop-color="#F6EFD8"/></linearGradient>
    <linearGradient id="talisay_farm-soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B98A57"/><stop offset="1" stop-color="#9C6E40"/></linearGradient>
    <pattern id="talisay_farm-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.3" fill="#2E2117" opacity=".13"/></pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#talisay_farm-sky)"/>
  <rect width="1920" height="420" fill="url(#talisay_farm-dots)" opacity=".5"/>
  <circle cx="1500" cy="190" r="64" fill="#F4C452" stroke="#2E2117" stroke-width="6"/>
  <path d="M0 470 C200 400 380 420 560 380 C760 340 900 400 1100 370 C1300 340 1500 400 1920 360 L1920 560 L0 560 Z" fill="#88AE86" stroke="#2E2117" stroke-width="5" stroke-linejoin="round"/>
  <path d="M0 540 C400 520 900 520 1920 530 L1920 1080 L0 1080 Z" fill="#9CC27A" stroke="#2E2117" stroke-width="6"/>
  <!-- ploughed field in perspective -->
  <path d="M420 580 L1500 580 L1900 1080 L20 1080 Z" fill="url(#talisay_farm-soil)" stroke="#2E2117" stroke-width="6" stroke-linejoin="round"/>
  <g fill="none" stroke="#7E5632" stroke-width="5" stroke-linecap="round">
    <path d="M560 580 L250 1080"/><path d="M700 580 L520 1080"/><path d="M840 580 L790 1080"/><path d="M980 580 L1060 1080"/><path d="M1120 580 L1330 1080"/><path d="M1260 580 L1600 1080"/><path d="M1400 580 L1860 1080"/>
  </g>
  <rect x="0" y="540" width="1920" height="540" fill="url(#talisay_farm-dots)" opacity=".3"/>
  <!-- fence -->
  <g stroke="#2E2117" stroke-width="5" stroke-linejoin="round" fill="#C9A26A">
    <path d="M1500 560 V640 H1516 V560 Z M1620 556 V640 H1636 V556 Z M1740 552 V640 H1756 V552 Z M1860 548 V640 H1876 V548 Z"/>
    <path d="M1490 580 L1900 568 L1900 582 L1490 594 Z M1490 610 L1900 600 L1900 614 L1490 624 Z"/>
  </g>
  <!-- the talisay tree (tiered canopy) -->
  <g stroke="#2E2117" stroke-width="6" stroke-linejoin="round">
    <path d="M230 780 L250 470 L290 470 L300 780 Z" fill="#8B5A2B"/>
    <path d="M90 520 C80 490 150 470 270 472 C390 470 460 490 450 520 C430 540 110 540 90 520 Z" fill="#4E8A43"/>
    <path d="M130 440 C122 414 180 398 270 400 C360 398 418 414 410 440 C394 458 146 458 130 440 Z" fill="#5A9A4C"/>
    <path d="M170 366 C164 344 210 330 270 332 C330 330 376 344 370 366 C356 382 184 382 170 366 Z" fill="#69A85A"/>
    <path d="M250 470 L200 500 M290 470 L340 500 M260 400 L220 430 M280 400 L320 430" fill="none" stroke-width="5"/>
  </g>
  <!-- young fruit trees in rows (sprout in the scene) -->
  <g stroke="#2E2117" stroke-width="5" stroke-linejoin="round">
    <g id="tree-1" transform="translate(620 640)"><path d="M-6 0 V-60 H6 V0 Z" fill="#8B5A2B"/><circle cy="-80" r="34" fill="#5A9A4C"/><circle cx="-10" cy="-86" r="6" fill="#F2B33D" stroke-width="3"/></g>
    <g id="tree-2" transform="translate(900 640)"><path d="M-6 0 V-60 H6 V0 Z" fill="#8B5A2B"/><circle cy="-80" r="34" fill="#5A9A4C"/><circle cx="12" cy="-74" r="6" fill="#F2B33D" stroke-width="3"/></g>
    <g id="tree-3" transform="translate(1180 640)"><path d="M-6 0 V-60 H6 V0 Z" fill="#8B5A2B"/><circle cy="-80" r="34" fill="#5A9A4C"/><circle cx="-8" cy="-72" r="6" fill="#F2B33D" stroke-width="3"/></g>
    <g id="tree-4" transform="translate(520 800) scale(1.3)"><path d="M-6 0 V-60 H6 V0 Z" fill="#8B5A2B"/><circle cy="-80" r="34" fill="#5A9A4C"/><circle cx="10" cy="-88" r="6" fill="#F2B33D" stroke-width="3"/></g>
    <g id="tree-5" transform="translate(940 800) scale(1.3)"><path d="M-6 0 V-60 H6 V0 Z" fill="#8B5A2B"/><circle cy="-80" r="34" fill="#5A9A4C"/><circle cx="-12" cy="-78" r="6" fill="#F2B33D" stroke-width="3"/></g>
    <g id="tree-6" transform="translate(1360 800) scale(1.3)"><path d="M-6 0 V-60 H6 V0 Z" fill="#8B5A2B"/><circle cy="-80" r="34" fill="#5A9A4C"/><circle cx="8" cy="-70" r="6" fill="#F2B33D" stroke-width="3"/></g>
  </g>
  <!-- European iron plough -->
  <g id="plough" transform="translate(1500 880)" stroke="#2E2117" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-160 -120 L40 20" fill="none" stroke="#8B5A2B" stroke-width="14"/>
    <path d="M-160 -120 L-200 -150 M-150 -100 L-200 -110" fill="none" stroke="#8B5A2B" stroke-width="10"/>
    <path d="M0 0 L80 10 L120 60 L20 50 Z" fill="#6E7A86"/>
    <path d="M30 20 L70 26" fill="none" stroke="#A9B3BC" stroke-width="4"/>
    <circle cx="-40" cy="40" r="30" fill="#8B5A2B"/><circle cx="-40" cy="40" r="8" fill="#2E2117"/>
  </g>
</svg>
