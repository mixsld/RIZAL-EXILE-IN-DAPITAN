<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 60 880 640">
  <defs>
    <linearGradient id="envelope_seal-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8EBCF"/><stop offset="1" stop-color="#EBD7AE"/></linearGradient>
    <radialGradient id="envelope_seal-wax" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#C2433F"/><stop offset=".6" stop-color="#9E2A2B"/><stop offset="1" stop-color="#6E1A1C"/></radialGradient>
    <pattern id="envelope_seal-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#2E2117" opacity=".14"/></pattern>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="505" cy="650" rx="420" ry="26" fill="#2E2117" opacity=".18"/>

  <!-- letter (slides up out of the envelope) -->
  <g id="letter" opacity="0">
    <path d="M170 120 L830 120 L830 560 L170 560 Z" fill="#FFFCF2" stroke="#2E2117" stroke-width="6" stroke-linejoin="round"/>
    <g fill="none" stroke="#C9B48E" stroke-width="3" stroke-linecap="round">
      <path d="M220 200 H780"/><path d="M220 250 H780"/><path d="M220 300 H780"/><path d="M220 350 H780"/><path d="M220 400 H700"/>
    </g>
    <text id="letter-text" x="500" y="246" text-anchor="middle" font-family="'Segoe Print','Ink Free',cursive" font-size="40" fill="#2E2117">July 14, 1892…</text>
  </g>

  <g stroke="#2E2117" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- envelope body -->
    <path d="M120 190 Q120 176 134 176 L866 176 Q880 176 880 190 L880 606 Q880 620 866 620 L134 620 Q120 620 120 606 Z" fill="url(#envelope_seal-paper)"/>
    <!-- side + bottom folds -->
    <path d="M124 612 L460 400 Q500 376 540 400 L876 612" fill="#E6CFA2"/>
    <path d="M124 184 L420 420" fill="none" opacity=".55"/>
    <path d="M876 184 L580 420" fill="none" opacity=".55"/>
    <path d="M150 600 L470 404 Q500 388 530 404 L850 600 Z" fill="url(#envelope_seal-dots)" stroke="none"/>
  </g>

  <!-- flap (rotates open around the top edge) -->
  <g id="flap">
    <path d="M122 182 Q120 176 134 176 L866 176 Q880 176 878 182 L530 444 Q500 466 470 444 Z" fill="#F1DFB9" stroke="#2E2117" stroke-width="6" stroke-linejoin="round"/>
    <path d="M200 200 L480 410" fill="none" stroke="#FFF8EA" stroke-width="6" stroke-linecap="round" opacity=".6"/>
  </g>

  <!-- wax seal -->
  <g id="seal" transform="translate(500 440)">
    <path d="M0 -78 C18 -80 26 -66 42 -66 C60 -64 62 -48 72 -38 C84 -24 76 -10 80 6 C84 22 70 32 66 46 C60 64 42 64 30 74 C16 84 2 74 -12 78 C-30 82 -40 68 -54 62 C-70 54 -70 38 -78 24 C-86 8 -74 -6 -76 -22 C-78 -40 -62 -48 -54 -60 C-44 -74 -22 -70 -12 -76 C-8 -78 -4 -78 0 -78 Z"
          fill="url(#envelope_seal-wax)" stroke="#2E2117" stroke-width="6" stroke-linejoin="round"/>
    <circle r="50" fill="none" stroke="#6E1A1C" stroke-width="5"/>
    <circle r="50" fill="none" stroke="#E2716B" stroke-width="2" opacity=".6" transform="translate(-2 -2)"/>
    <text y="22" text-anchor="middle" font-family="'Palatino Linotype', Georgia, serif" font-style="italic" font-weight="700" font-size="64" fill="#6E1A1C">R</text>
    <path d="M-34 -40 C-24 -52 -8 -56 6 -54" fill="none" stroke="#F2A49E" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    <!-- crack lines (shown when breaking) -->
    <g id="seal-crack" opacity="0" fill="none" stroke="#2E2117" stroke-width="5" stroke-linecap="round">
      <path d="M-6 -78 L4 -40 L-10 -6 L8 30 L-2 78"/>
    </g>
  </g>
</svg>
