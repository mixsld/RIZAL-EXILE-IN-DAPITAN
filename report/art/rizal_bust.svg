  <path d="M400 712 L350 688 Q340 712 352 738 Z" fill="#1C1F2A" stroke-width="5" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M400 712 L450 688 Q460 712 448 738 Z" fill="#1C1F2A" stroke-width="5" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="388" y="700" width="24" height="24" rx="6" fill="#1C1F2A" stroke-width="5" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round"/>

  </g>
  <!-- ===== EARS ===== -->
  <path d="M304 384 C278 372 264 400 271 428 C278 456 298 466 310 454 Z" fill="#E8B886" stroke="#2E2117" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M288 402 C284 417 288 432 298 440" stroke-width="4" opacity="0.6" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <path d="M502 384 C528 372 542 400 535 428 C528 456 508 466 496 454 Z" fill="#E8B886" stroke="#2E2117" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M518 402 C522 417 518 432 508 440" stroke-width="4" opacity="0.6" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

  <!-- ===== FACE ===== -->
  <path d="M296 372 C296 270 346 222 404 222 C466 222 512 270 510 372 C509 452 490 528 448 570 C428 590 382 590 362 570 C320 528 297 452 296 372 Z" fill="#E8B886"/>
  <g clip-path="url(#rizal_bust-face)">
