  </g>

  <!-- ===== NOSE ===== -->
  <path d="M412 392 C410 422 404 444 396 458" stroke="#A86F45" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <path d="M386 464 C394 474 414 476 428 466" stroke-width="5" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

  <!-- ===== MOUSTACHE + MOUTH ===== -->
  <path d="M360 502 C376 486 396 488 405 496 C414 488 434 486 450 502 C434 500 418 504 405 506 C392 504 376 500 360 502 Z" fill="#2A211C" stroke-width="3" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round"/>
  <g id="mouth-calm"><path d="M378 526 C394 535 416 535 432 526" stroke-width="5" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <path d="M392 544 C400 548 410 548 418 544" stroke="#A86F45" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/></g>
  <g id="mouth-firm" opacity="0"><path d="M380 527 L430 527" fill="none" stroke="#2E2117" stroke-width="6" stroke-linecap="round"/></g>
  <g id="mouth-smile" opacity="0"><path d="M374 520 C390 542 420 542 436 520 C420 528 390 528 374 520 Z" fill="#7A2E22" stroke="#2E2117" stroke-width="5" stroke-linejoin="round"/></g>
</svg>
