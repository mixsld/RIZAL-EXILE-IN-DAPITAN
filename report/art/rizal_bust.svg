  <path d="M418 362 C434 350 464 350 480 366" stroke="#2A211C" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  </g>
  <g id="brows-think" opacity="0" fill="none" stroke="#2A211C" stroke-width="11" stroke-linecap="round">
    <path d="M332 354 C350 336 380 338 396 352"/><path d="M418 366 C434 360 464 360 480 370"/>
  </g>

  <!-- ===== EYES ===== -->
  <g id="eyes-open">
  <g>
    <path d="M340 400 C352 385 382 385 394 400 C382 410 352 410 340 400 Z" fill="#FFFDF7" stroke-width="4" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="370" cy="398" r="9.5" fill="#2A1A12"/>
    <circle cx="373.5" cy="394.5" r="3" fill="#FFFFFF"/>
    <path d="M338 399 C352 382 384 382 396 398" stroke-width="7" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  </g>
  <g>
    <path d="M420 400 C432 385 462 385 474 400 C462 410 432 410 420 400 Z" fill="#FFFDF7" stroke-width="4" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="450" cy="398" r="9.5" fill="#2A1A12"/>
    <circle cx="453.5" cy="394.5" r="3" fill="#FFFFFF"/>
    <path d="M418 398 C430 382 462 382 476 399" stroke-width="7" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  </g>
  </g>
