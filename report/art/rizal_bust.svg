    <ellipse cx="466" cy="452" rx="22" ry="12" fill="#E0876A" opacity="0.22"/>
  </g>
  <path d="M296 372 C296 270 346 222 404 222 C466 222 512 270 510 372 C509 452 490 528 448 570 C428 590 382 590 362 570 C320 528 297 452 296 372 Z" fill="none" stroke="#2E2117" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

