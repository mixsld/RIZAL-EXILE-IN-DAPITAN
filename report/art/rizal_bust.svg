    <path d="M330 262 C350 246 380 240 410 242"/>
    <path d="M490 236 C502 256 506 280 506 302"/>
  </g>
  <!-- side-part line -->
  <path d="M464 268 C474 250 482 232 482 212" stroke="#14100D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

  <!-- ===== BROWS ===== -->
  <g id="brows-calm">
