  <path d="M316 302 C312 246 356 204 420 202 C454 202 478 218 484 242 C454 230 414 234 386 252 C358 268 336 286 316 302 Z" fill="#3B2F28" stroke-width="5" stroke="#2E2117" stroke-linejoin="round" stroke-linecap="round"/>
