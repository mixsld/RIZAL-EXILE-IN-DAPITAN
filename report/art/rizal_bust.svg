  <path d="M290 392 C272 318 288 238 342 204 C388 174 462 172 502 206 C530 232 526 268 514 302 C506 292 496 284 486 278 L464 268 C438 292 394 300 352 304 C328 326 312 356 304 396 Z" fill="#2A211C" stroke="#2E2117" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
