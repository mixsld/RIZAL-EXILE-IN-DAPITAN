    <path d="M474 300 C504 380 504 460 476 520 C458 556 432 580 404 594 L520 600 L520 300 Z" fill="#C48D5C" opacity="0.55"/>
    <path d="M474 300 C504 380 504 460 476 520 C458 556 432 580 404 594 L520 600 L520 300 Z" fill="url(#rizal_bust-dots)" opacity="0.7"/>
