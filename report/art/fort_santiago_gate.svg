  <g stroke="#2E2117" stroke-width="5" stroke-linejoin="round">
    <path d="M600 600 V680 M1320 600 V680" fill="none" stroke-width="8"/>
    <path d="M584 600 H616 L610 580 H590 Z M1304 600 H1336 L1330 580 H1310 Z" fill="#5A3A1C"/>
    <path d="M600 580 C584 560 596 536 600 520 C606 540 618 556 600 580 Z M1320 580 C1304 560 1316 536 1320 520 C1326 540 1338 556 1320 580 Z" fill="#F4B942"/>
