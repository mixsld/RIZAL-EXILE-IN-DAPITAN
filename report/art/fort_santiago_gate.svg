      <rect x="970" y="380" width="22" height="480"/><rect x="1030" y="400" width="22" height="460"/><rect x="1090" y="440" width="22" height="420"/>
      <rect x="770" y="560" width="380" height="20"/><rect x="770" y="700" width="380" height="20"/>
