    <pattern id="fort_santiago_gate-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.4" fill="#2E2117" opacity=".16"/></pattern>
    <pattern id="fort_santiago_gate-moss" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="3" fill="#6E7F58" opacity=".35"/><circle cx="15" cy="16" r="2" fill="#6E7F58" opacity=".3"/></pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#fort_santiago_gate-sky)"/>
  <rect width="1920" height="600" fill="url(#fort_santiago_gate-dots)" opacity=".6"/>
