<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="tondo_house_night-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14243D"/><stop offset="1" stop-color="#2D4466"/></linearGradient>
    <radialGradient id="tondo_house_night-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD98A" stop-opacity=".9"/><stop offset="1" stop-color="#FFD98A" stop-opacity="0"/></radialGradient>
    <linearGradient id="tondo_house_night-lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7A8"/><stop offset="1" stop-color="#F4B942"/></linearGradient>
    <pattern id="tondo_house_night-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.4" fill="#000" opacity=".22"/></pattern>
    <pattern id="tondo_house_night-capiz" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#3B4A62"/><path d="M0 0 H18 V18" fill="none" stroke="#1E2738" stroke-width="2.5"/></pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#tondo_house_night-sky)"/>
  <rect width="1920" height="700" fill="url(#tondo_house_night-dots)" opacity=".5"/>
  <!-- stars + moon -->
  <g fill="#FFF3C4">
    <path d="M220 160 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z"/><path d="M1620 120 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5 Z"/>
    <circle cx="420" cy="90" r="3"/><circle cx="700" cy="180" r="3"/><circle cx="1180" cy="110" r="3"/><circle cx="1400" cy="230" r="3"/><circle cx="1780" cy="300" r="3"/><circle cx="90" cy="320" r="3"/>
  </g>
  <circle cx="1680" cy="190" r="74" fill="#FFF0C2" stroke="#2E2117" stroke-width="6"/>
  <circle cx="1708" cy="170" r="70" fill="#22385A"/>

  <!-- neighbour houses (dim) -->
  <g stroke="#0E1626" stroke-width="6" stroke-linejoin="round" fill="#243652">
    <path d="M0 780 V470 H300 V780 Z"/><path d="M-20 474 L150 400 L320 474 Z" fill="#2B3E5C"/>
    <path d="M1640 780 V500 H1920 V780 Z"/><path d="M1620 504 L1780 430 L1940 504 Z" fill="#2B3E5C"/>
  </g>
  <g fill="#3B4A62" stroke="#0E1626" stroke-width="4"><rect x="60" y="520" width="80" height="60"/><rect x="170" y="520" width="80" height="60"/><rect x="1690" y="550" width="80" height="60"/><rect x="1800" y="550" width="80" height="60"/></g>

  <!-- ===== the bahay na bato ===== -->
  <g stroke="#2E2117" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- stone ground floor -->
    <path d="M360 800 V600 H1560 V800 Z" fill="#8E8A80"/>
    <g fill="none" stroke="#5E5A52" stroke-width="3" opacity=".8">
      <path d="M360 650 H1560 M360 700 H1560 M360 750 H1560"/>
      <path d="M440 600 V650 M620 650 V700 M820 600 V650 M1060 650 V700 M1260 600 V650 M1440 650 V700 M520 700 V750 M1340 700 V750 M760 750 V800 M1160 750 V800"/>
    </g>
    <path d="M880 800 V690 Q960 620 1040 690 V800 Z" fill="#4A2E1A"/>
    <path d="M960 640 V800" fill="none" stroke-width="4"/>
    <!-- wooden upper floor -->
    <path d="M330 600 V380 H1590 V600 Z" fill="#7A4E2E"/>
    <path d="M330 600 H1590" fill="none"/>
    <path d="M330 420 H1590" fill="none" stroke-width="4" opacity=".6"/>
    <!-- roof -->
    <path d="M280 386 L460 250 L1460 250 L1640 386 Z" fill="#7E3426"/>
    <g fill="none" stroke="#5A2219" stroke-width="4"><path d="M340 340 H1580 M400 296 H1520"/></g>
  </g>
  <rect x="330" y="380" width="1260" height="220" fill="url(#tondo_house_night-dots)"/>

  <!-- six windows (lit one at a time by the scene) -->
  <g stroke="#2E2117" stroke-width="6" stroke-linejoin="round">
    <g id="win-1" transform="translate(380 440)"><rect width="160" height="130" rx="6" fill="#1E2738"/><rect data-glow="" width="160" height="130" rx="6" fill="url(#tondo_house_night-lit)" opacity="0"/><path d="M80 0 V130" fill="none" stroke-width="4"/></g>
    <g id="win-2" transform="translate(580 440)"><rect width="160" height="130" rx="6" fill="#1E2738"/><rect data-glow="" width="160" height="130" rx="6" fill="url(#tondo_house_night-lit)" opacity="0"/><path d="M80 0 V130" fill="none" stroke-width="4"/></g>
    <g id="win-3" transform="translate(780 440)"><rect width="160" height="130" rx="6" fill="#1E2738"/><rect data-glow="" width="160" height="130" rx="6" fill="url(#tondo_house_night-lit)" opacity="0"/><path d="M80 0 V130" fill="none" stroke-width="4"/></g>
    <g id="win-4" transform="translate(980 440)"><rect width="160" height="130" rx="6" fill="#1E2738"/><rect data-glow="" width="160" height="130" rx="6" fill="url(#tondo_house_night-lit)" opacity="0"/><path d="M80 0 V130" fill="none" stroke-width="4"/></g>
    <g id="win-5" transform="translate(1180 440)"><rect width="160" height="130" rx="6" fill="#1E2738"/><rect data-glow="" width="160" height="130" rx="6" fill="url(#tondo_house_night-lit)" opacity="0"/><path d="M80 0 V130" fill="none" stroke-width="4"/></g>
    <g id="win-6" transform="translate(1380 440)"><rect width="160" height="130" rx="6" fill="#1E2738"/><rect data-glow="" width="160" height="130" rx="6" fill="url(#tondo_house_night-lit)" opacity="0"/><path d="M80 0 V130" fill="none" stroke-width="4"/></g>
  </g>
  <!-- capiz sliding panels pushed aside -->
  <g stroke="#2E2117" stroke-width="4">
    <rect x="352" y="440" width="24" height="130" fill="url(#tondo_house_night-capiz)"/><rect x="1544" y="440" width="24" height="130" fill="url(#tondo_house_night-capiz)"/>
  </g>
  <!-- ventanillas -->
  <g fill="#2B3446" stroke="#2E2117" stroke-width="4"><rect x="400" y="580" width="1120" height="16"/></g>

  <!-- street + lamp -->
  <path d="M0 780 H1920 V1080 H0 Z" fill="#3A3F4A"/>
  <path d="M0 780 H1920" stroke="#2E2117" stroke-width="6"/>
  <rect y="800" width="1920" height="280" fill="url(#tondo_house_night-dots)" opacity=".6"/>
  <ellipse cx="1700" cy="880" rx="200" ry="40" fill="#FFD98A" opacity=".15"/>
  <g stroke="#2E2117" stroke-width="6" stroke-linejoin="round">
    <path d="M1700 880 V600" fill="none" stroke-width="10"/>
    <path d="M1670 600 L1730 600 L1720 548 L1680 548 Z" fill="#FFD98A"/>
    <path d="M1664 548 L1736 548 L1700 520 Z" fill="#2E2117"/>
  </g>
  <circle cx="1700" cy="574" r="110" fill="url(#tondo_house_night-glow)"/>
</svg>
